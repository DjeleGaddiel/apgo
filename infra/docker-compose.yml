# Services nécessaires au développement local.
# Lancement : docker compose -f infra/docker-compose.yml up -d
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: apgo
      POSTGRES_PASSWORD: apgo
      POSTGRES_DB: apgo
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8
    ports:
      - '6379:6379'

  meilisearch:
    image: getmeili/meilisearch:v1.15
    environment:
      MEILI_MASTER_KEY: apgo-dev-master-key
      MEILI_ENV: development
    ports:
      - '7700:7700'
    volumes:
      - meili-data:/meili_data

volumes:
  postgres-data:
  meili-data:
